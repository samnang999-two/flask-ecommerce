{% extends 'admin/master.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Edit User</h2>
        <p class="text-muted mb-0">Update user information.</p>
    </div>

    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-2"></i>Back
    </a>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">

            <!-- Avatar Preview Zone -->
            <div class="text-center mb-4">
                <img id="avatarPreview"
                     src="{% if user.profile %}{{ url_for('static', filename=user.profile) }}{% else %}{{ url_for('static', filename='images/photo.jpg') }}{% endif %}"
                     class="rounded-circle border shadow"
                     width="120"
                     height="120"
                     style="object-fit: cover;">

                <div class="mt-3 col-md-4 mx-auto">
                    <input type="file"
                           class="form-control"
                           name="avatar"
                           id="avatarInput"
                           accept="image/*"
                           onchange="previewImage(event)">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="role" class="form-select">
                        <option value="Administrator" {% if user.role == 'Administrator' %}selected{% endif %}>Administrator</option>
                        <option value="Vendor" {% if user.role == 'Vendor' %}selected{% endif %}>Vendor</option>
                        <option value="Customer" {% if user.role == 'Customer' %}selected{% endif %}>Customer</option>
                    </select>
                </div>
            </div>

            <hr>

            <div class="text-end">
                <a href="{{ url_for('admin_users') }}" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-warning px-4 text-white">
                    <i class="fa-solid fa-pen-to-square me-2"></i>Update User
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatarPreview').src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
}
</script>

{% endblock %}
