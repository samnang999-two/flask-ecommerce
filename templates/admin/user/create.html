{% extends 'admin/master.html' %}

{% block title %}Create User{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Create User</h2>
        <p class="text-muted mb-0">Add a new user to your system.</p>
    </div>

    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-2"></i>Back
    </a>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin_user_create') }}" enctype="multipart/form-data">

            <!-- Profile Image / Avatar Upload -->
            <div class="text-center mb-4">
                <img id="avatarPreview"
                     src="{{ url_for('static', filename='images/photo.jpg') }}"
                     class="rounded-circle border shadow"
                     width="120"
                     height="120"
                     style="object-fit: cover;">

                <div class="mt-3 col-md-4 mx-auto">
                    <input type="file"
                           class="form-control"
                           name="avatar"
                           id="avatarInput"
                           accept="image/*"
                           onchange="previewImage(event)">
                </div>
            </div>

            <div class="row">
                <!-- កែប្រែ name="name" ទៅជា name="username" -->
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Role</label>
                    <select class="form-select" name="role">
                        <option value="Admin">Administrator</option>
                        <option value="Vendor">Vendor</option>
                        <option value="Customer" selected>Customer</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <!-- រំលង/ទុកទទេ ប្រសិនបើគ្មាន field phone ក្នុង Model -->
                    <label class="form-label fw-semibold">Phone (Optional)</label>
                    <input type="text" class="form-control" name="phone" placeholder="+855 12 345 678">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm_password" required>
                </div>
            </div>

            <hr>

            <div class="text-end">
                <a href="{{ url_for('admin_users') }}" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save User
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('avatarPreview');
        output.src = reader.result;
    }
    if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}
</script>

{% endblock %}
